name: Offline checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check
      - run: pytest -q
      - name: Synthetic offline rebuild
        run: |
          python -m indexkit.fixtures --directory "$RUNNER_TEMP/fixture"
          python run_all.py --config "$RUNNER_TEMP/fixture/fixture_config.json" --output-dir "$RUNNER_TEMP/artifacts"
